  function show(q) {
    if (!data) { meta.textContent = 'Loading the tool index…'; return; }
    if (!q) {
      var sites = data.filter(function (e) { return e.c === 'Website'; });
      var pop = popular(12);
      meta.textContent = (usingFallback ? 'Showing popular tools — the full index is on its way. ' : '') +
        'Browse all ' + sites.length + ' Loona websites, or start typing above to search ' + data.length + ' tools, sites and guides.';
      box.innerHTML = '<h2 class="sec">Popular tools</h2>' + pop.map(card).join('') +
                      (sites.length ? '<h2 class="sec">All Loona websites</h2>' + sites.map(card).join('') : '');
      return;
    }
    var r = runSearch(q, 60);
    if (r.length) {
      meta.textContent = (usingFallback ? 'Showing popular tools while the full index loads. ' : '') +
        'Showing ' + r.length + ' result' + (r.length === 1 ? '' : 's') + ' for “' + q + '”';
      box.innerHTML = r.map(card).join('');
    } else {
      meta.textContent = 'No exact match for “' + q + '” — try these popular tools:';
      box.innerHTML = popular(12).map(card).join('');
    }
  }
  function ensureIndex() {
    if (data && !usingFallback) return;
    if (loading) return;
    loading = fetch(INDEX_URL).then(function (r) {
      if (!r.ok) throw new Error('index ' + r.status);
      return r.json();
    }).then(function (j) {
      data = j; usingFallback = false; loading = null; show(input.value);
    }).catch(function () {
      loading = null;
      if (!data) { data = FALLBACK; usingFallback = true; }
      show(input.value);
    });
  }
  var params = new URLSearchParams(window.location.search);
  var q0 = params.get('q') || '';
  input.value = q0;
  show(q0);
  ensureIndex();
  var t = null;
  input.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { ensureIndex(); show(input.value); }, 90); });
  document.getElementById('sForm').addEventListener('submit', function (ev) {
    ev.preventDefault(); ensureIndex(); show(input.value);
    if (window.history && history.replaceState) { history.replaceState(null, '', '?q=' + encodeURIComponent(input.value)); }
  });
})();

</script>
</body>
</html>
