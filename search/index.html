<style>:root{--teal:#062e2a;--teal2:#0a4a42;--gold:#d4af37;--gold2:#ffd95e;--ink:#1c2422;--bg:#f7f5ee}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

<script>/*loona-search-page*/(function(){"use strict";
function norm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function lev(a, b) {
    if (a === b) return 0;
    var la = a.length, lb = b.length, i, j;
    if (Math.abs(la - lb) > 1) return 2;
    var prev = [], cur = [];
    for (j = 0; j <= lb; j++) prev[j] = j;
    for (i = 1; i <= la; i++) {
      cur[0] = i; var best = 99;
      for (j = 1; j <= lb; j++) {
        var v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        cur[j] = v; if (v < best) best = v;
      }
      if (best > 1) return 2;
      var t = prev; prev = cur; cur = t;
    }
    return prev[lb];
  }
  function wordLevel(w, nameWords, hayWords) {
    var i;
    for (i = 0; i < nameWords.length; i++) if (nameWords[i] === w) return 30;
    for (i = 0; i < nameWords.length; i++) if (w.length >= 3 && nameWords[i].indexOf(w) === 0) return 24;
    for (i = 0; i < hayWords.length; i++) if (hayWords[i] === w) return 20;
    if (w.length >= 4) {
      for (i = 0; i < nameWords.length; i++) if (lev(w, nameWords[i]) <= 1) return 17;
      for (i = 0; i < hayWords.length; i++) if (lev(w, hayWords[i]) <= 1) return 12;
    }
    for (i = 0; i < nameWords.length; i++) if (nameWords[i].indexOf(w) >= 0) return 14;
    return 0;
  }
  function runSearch(q, limit) {
    var query = norm(q);
    if (!query || !data) return [];
    var qw = query.split(' '), out = [];
    for (var e = 0; e < data.length; e++) {
      var it = data[e], name = norm(it.n),
          hay = name + ' ' + norm(it.s) + ' ' + (it.k || ''),
          nameWords = name.split(' '), hayWords = hay.split(' '),
          sum = 0, ok = true;
      for (var i = 0; i < qw.length; i++) {
        var lv = wordLevel(qw[i], nameWords, hayWords);
        if (lv === 0) { ok = false; break; }
        sum += lv;
      }
      if (!ok) continue;
      var score = sum * 10;
      if (name === query) score += 100000;
      else if (name.indexOf(query) === 0) score += 5000;
      else if (name.indexOf(query) >= 0) score += 2000;
      if (qw.length > 1) {
        var allN = true;
        for (var k = 0; k < qw.length; k++) if (nameWords.indexOf(qw[k]) < 0) allN = false;
        if (allN) score += 800;
      }
      score -= (typeof it.p === 'number' ? it.p : 400) * 0.6;
      score -= name.length * 0.3;
      out.push({ it: it, score: score });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, limit).map(function (x) { return x.it; });
  }
  
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function badge(e){return e.c==='Website'?'Website':(e.c==='Guide'?'Guide':e.s.replace(/^Loona /,''));}
  var input=document.getElementById('q'), box=document.getElementById('results'), meta=document.getElementById('meta');
  var data=null;
  function card(e){
    return '<a class="res" href="'+esc(e.u)+'"><span class="ls-nm">'+esc(e.n)+'</span><span class="ls-badge">'+esc(badge(e))+'</span><span class="ls-ds">'+esc(e.d)+'</span></a>';
  }
  function show(q){
    if(!data){box.innerHTML='<p class="ls-none">Loading the tool index&hellip;</p>';return;}
    if(!q){
      var sites=data.filter(function(e){return e.c==='Website';});
      var pop=data.filter(function(e){return typeof e.p==='number'&&e.p<12;}).sort(function(a,b){return a.p-b.p;});
      meta.textContent='Browse all '+sites.length+' Loona websites, or start typing above to search '+(data.length)+' tools, sites and guides.';
      box.innerHTML='<h2 class="sec">Popular tools</h2>'+pop.map(card).join('')+'<h2 class="sec">All Loona websites</h2>'+sites.map(card).join('');
      return;
    }
    var r=runSearch(q,60);
    meta.textContent=r.length?('Showing '+r.length+' result'+(r.length===1?'':'s')+' for \u201c'+q+'\u201d'):('No tool matches \u201c'+q+'\u201d yet. Try \u201cage\u201d, \u201cemi\u201d, \u201czakat\u201d or \u201cpdf\u201d.');
    box.innerHTML=r.map(card).join('');
  }
  var params=new URLSearchParams(window.location.search);
  var q0=params.get('q')||'';
  input.value=q0;
  fetch('../search-index.json').then(function(r){return r.json();}).then(function(j){data=j;show(q0);}).catch(function(){meta.textContent='The tool index could not be loaded. Please reload the page.';});
  var t=null;
  input.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){show(input.value);},90);});
  document.getElementById('sForm').addEventListener('submit',function(ev){ev.preventDefault();show(input.value);if(window.history&&history.replaceState){history.replaceState(null,'','?q='+encodeURIComponent(input.value));}});
})();
</script>
